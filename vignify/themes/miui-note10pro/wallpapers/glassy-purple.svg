<svg width="2340" height="1080" viewBox="0 0 2340 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B2CFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#176DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F000E8;stop-opacity:1" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="50" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="2340" height="1080" fill="#0a0a0f"/>
  
  <!-- Gradient overlay -->
  <rect width="2340" height="1080" fill="url(#grad1)" opacity="0.3"/>
  
  <!-- Glass circles -->
  <circle cx="400" cy="300" r="200" fill="#8B2CFF" opacity="0.2" filter="url(#blur1)"/>
  <circle cx="1800" cy="600" r="250" fill="#176DFF" opacity="0.2" filter="url(#blur1)"/>
  <circle cx="1000" cy="800" r="180" fill="#F000E8" opacity="0.15" filter="url(#blur1)"/>
  
  <!-- Central glass card -->
  <rect x="920" y="380" width="500" height="320" rx="24" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Title -->
  <text x="1170" y="540" font-family="Arial" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Glassy Theme</text>
  <text x="1170" y="600" font-family="Arial" font-size="24" fill="rgba(255,255,255,0.7)" text-anchor="middle">MIUI for Redmi Note 10 Pro</text>
</svg>
